document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

items: center; gap: 16px\">\n<img src=\"c68bec63-7417-4d27-a682-81d940de7221\" alt=\"Logo del Instituto Nuestra Señora de Fátima\" style=\"width: 68px; height: 68px; display: block\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<div style=\"font-family: Georgia, serif; font-size: 20px; font-weight: 700; color: #282829\">Instituto Técnico Nuestra Señora de Fátima<\u002Fdiv>\n<div style=\"font-size: 13px; color: #6A6360; letter-spacing: 0.08em; text-transform: uppercase\">Secundaria Diurna · A-893<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<nav style=\"display: flex; gap: 28px; align-items: center; font-size: 16px\">\n<a href=\"#inicio\" style=\"color: #282829; text-decoration: none; padding: 12px 0\">Inicio<\u002Fa>\n<div class=\"nav-item\">\n<a href=\"#nosotros\" style=\"color: #282829; text-decoration: none; padding: 12px 0; display: inline-block\">Sobre nosotros ▾<\u002Fa>\n<div class=\"nav-menu\">\n<a href=\"#historia\">Nuestra historia<\u002Fa>\n<a href=\"#marianistas\">Red Marianista<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"nav-item\">\n<a href=\"#orientaciones\" style=\"color: #282829; text-decoration: none; padding: 12px 0; display: inline-block\">Orientaciones ▾<\u002Fa>\n<div class=\"nav-menu nav-menu-right\">\n<a href=\"#gestion\">Gestión y Administración de las Organizaciones<\u002Fa>\n<a href=\"#computacion\">Computación<\u002Fa>\n<a href=\"#electromecanica\">Electromecánica<\u002Fa>\n<a href=\"#bachillerato\">Bachiller en Ciencias Sociales<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<a href=\"#contacto\" style=\"color: #FFFFFF; background: #DB353A; text-decoration: none; padding: 12px 24px; border-radius: 999px; font-weight: 700\">Contacto<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n<!-- HERO -->\n<section style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px; align-items: center; padding: 88px 64px 96px 64px\">\n<div style=\"display: flex; flex-direction: column; gap: 28px\">\n<div style=\"font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #B8282E; font-weight: 700\">Secundaria técnica y bachillerato · Villa Soldati<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: Georgia, serif; font-size: 58px; line-height: 1.08; color: #282829; font-weight: 700\">Una escuela pensada para los chicos del barrio.<\u002Fh1>\n<p style=\"margin: 0; font-size: 20px; line-height: 1.55; color: #46423F; max-width: 34em\">Educamos en el corazón de Villa Soldati desde 1958. Hoy, como parte de la Red Educativa Marianista, formamos técnicos y bachilleres comprometidos con su comunidad.<\u002Fp>\n<div style=\"display: flex; gap: 16px; flex-wrap: wrap\">\n<a href=\"#orientaciones\" style=\"display: inline-block; background: {{accent}}; color: #FFFFFF; text-decoration: none; padding: 16px 30px; border-radius: 999px; font-size: 17px; font-weight: 700\">Conocé las orientaciones<\u002Fa>\n<a href=\"#historia\" style=\"display: inline-block; color: #282829; text-decoration: none; padding: 14px 28px; border-radius: 999px; font-size: 17px; font-weight: 700; border: 2px solid #282829\">Nuestra historia<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position: relative; height: 460px; border-radius: 28px\">\n<img src=\"105f7701-c3c2-44a2-a5d2-acb58866ed21\" alt=\"Patio del Instituto Nuestra Señora de Fátima con alumnos en el recreo\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: center 45%; border-radius: 28px; display: block\">\n<img src=\"c68bec63-7417-4d27-a682-81d940de7221\" alt=\"\" style=\"position: absolute; left: -44px; bottom: -44px; width: 140px; height: 140px; display: block; filter: drop-shadow(0 6px 16px rgba(40,40,41,0.28))\">\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- LO QUE NOS DISTINGUE -->\n<section style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px; padding: 48px 64px; background: #DB353A; color: #FFFFFF\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: Georgia, serif; font-size: 22px; line-height: 1.25; font-weight: 700; color: #FFFFFF\">Aprender haciendo<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.5; color: #FFFFFF\">Talleres, laboratorio de informática y proyectos reales desde los primeros años.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: Georgia, serif; font-size: 22px; line-height: 1.25; font-weight: 700; color: #FFFFFF\">Prácticas profesionalizantes<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.5; color: #FFFFFF\">Experiencias en ámbitos de trabajo para completar la formación técnica.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: Georgia, serif; font-size: 22px; line-height: 1.25; font-weight: 700; color: #FFFFFF\">Acompañamiento<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.5; color: #FFFFFF\">Un equipo de orientación que acompaña la trayectoria de cada estudiante.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: Georgia, serif; font-size: 22px; line-height: 1.25; font-weight: 700; color: #FFFFFF\">Espíritu marianista<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.5; color: #FFFFFF\">Una escuela con vocación social: pacíficos, solidarios y agradecidos.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ORIENTACIONES -->\n<section id=\"orientaciones\" style=\"padding: 104px 64px 96px 64px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px\">\n<div style=\"font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #B8282E; font-weight: 700\">Secundaria diurna<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: Georgia, serif; font-size: 44px; line-height: 1.15; color: #282829\">Cuatro caminos para terminar la escuela con futuro<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #46423F\">Tres tecnicaturas y un bachillerato, con la formación general de la escuela secundaria y una mirada puesta en el trabajo y en la comunidad.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; padding: 28px; background: #FFFFFF; border: 1px solid #E8E2DF; border-radius: 20px; min-height: 240px\">\n<div style=\"width: 44px; height: 6px; background: #DB353A; border-radius: 3px\"><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 8px; align-items: center\"><div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #6A6360; font-weight: 700\">Título técnico<\u002Fdiv><div style=\"font-size: 13px; font-weight: 700; color: #FFFFFF; background: #DB353A; padding: 4px 10px; border-radius: 999px\">Desde 2016<\u002Fdiv><\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 24px; line-height: 1.25; font-weight: 700; color: #282829\">Técnico en Gestión y Administración de las Organizaciones<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.55; color: #46423F\">Organiza, programa y controla las operaciones comerciales, financieras y administrativas de empresas, pymes, organismos públicos y emprendimientos: compras, ventas, finanzas, recursos humanos y contabilidad.<\u002Fdiv>\n<a href=\"#gestion\" style=\"margin-top: auto; padding-top: 8px; color: #B8282E; font-weight: 700; text-decoration: none; font-size: 16px\">Ver más →<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 14px; padding: 28px; background: #FFFFFF; border: 1px solid #E8E2DF; border-radius: 20px; min-height: 240px\">\n<div style=\"width: 44px; height: 6px; background: #282829; border-radius: 3px\"><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 8px; align-items: center\"><div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #6A6360; font-weight: 700\">Título técnico<\u002Fdiv><div style=\"font-size: 13px; font-weight: 700; color: #FFFFFF; background: #DB353A; padding: 4px 10px; border-radius: 999px\">Desde 2021<\u002Fdiv><\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 24px; line-height: 1.25; font-weight: 700; color: #282829\">Técnico en Computación<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.55; color: #46423F\">Desarrolla, instala y mantiene aplicaciones y sistemas informáticos, documenta su trabajo y asesora a los usuarios. Programación, bases de datos, redes y proyectos informáticos.<\u002Fdiv>\n<a href=\"#computacion\" style=\"margin-top: auto; padding-top: 8px; color: #B8282E; font-weight: 700; text-decoration: none; font-size: 16px\">Ver más →<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 14px; padding: 28px; background: #FFFFFF; border: 1px solid #E8E2DF; border-radius: 20px; min-height: 240px\">\n<div style=\"width: 44px; height: 6px; background: #DA7B53; border-radius: 3px\"><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 8px; align-items: center\"><div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #6A6360; font-weight: 700\">Título técnico<\u002Fdiv><div style=\"font-size: 13px; font-weight: 700; color: #FFFFFF; background: #DB353A; padding: 4px 10px; border-radius: 999px\">Desde 1979<\u002Fdiv><\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 24px; line-height: 1.25; font-weight: 700; color: #282829\">Técnico Electromecánico<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.55; color: #46423F\">Proyecta, opera y mantiene equipos e instalaciones eléctricas, mecánicas, neumáticas e hidráulicas, junto con sus sistemas de control y automatización.<\u002Fdiv>\n<a href=\"#electromecanica\" style=\"margin-top: auto; padding-top: 8px; color: #B8282E; font-weight: 700; text-decoration: none; font-size: 16px\">Ver más →<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 14px; padding: 28px; background: #FFFFFF; border: 1px solid #E8E2DF; border-radius: 20px; min-height: 240px\">\n<div style=\"width: 44px; height: 6px; background: #A8262C; border-radius: 3px\"><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 8px; align-items: center\"><div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #6A6360; font-weight: 700\">Bachillerato<\u002Fdiv><div style=\"font-size: 13px; font-weight: 700; color: #FFFFFF; background: #DB353A; padding: 4px 10px; border-radius: 999px\">Desde 2015<\u002Fdiv><\u002Fdiv>\n<div style=\"font-family: Georgia, serif; font-size: 24px; line-height: 1.25; font-weight: 700; color: #282829\">Bachiller en Ciencias Sociales<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.55; color: #46423F\">Amplía el conocimiento del mundo social desde la historia, la geografía, la economía y la cultura, con mirada crítica y participación en proyectos con la comunidad.<\u002Fdiv>\n<a href=\"#bachillerato\" style=\"margin-top: auto; padding-top: 8px; color: #B8282E; font-weight: 700; text-decoration: none; font-size: 16px\">Ver más →<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- DETALLE DE ORIENTACIONES -->\n<section style=\"padding: 16px 64px 72px 64px; display: flex; flex-direction: column\">\n<div style=\"font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #B8282E; font-weight: 700; padding-bottom: 8px\">Conocé cada orientación<\u002Fdiv>\n<div id=\"gestion\" style=\"display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 56px; align-items: start; padding: 56px 0;\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; gap: 12px; align-items: center\"><div style=\"width: 44px; height: 6px; background: #DB353A; border-radius: 3px\"><\u002Fdiv><div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #6A6360; font-weight: 700\">Título técnico · Desde 2016<\u002Fdiv><\u002Fdiv>\n<h3 style=\"margin: 0; font-family: Georgia, serif; font-size: 34px; line-height: 1.2; color: #282829\">Técnico en Gestión y Administración de las Organizaciones<\u002Fh3>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #46423F\">Te prepara para trabajar en la administración de todo tipo de organizaciones: empresas, pymes, organismos públicos y emprendimientos. Vas a aprender a llevar adelante las operaciones comerciales, financieras y contables, a registrar y controlar la información y a planificar los recursos que cada área necesita, participando en la toma de decisiones.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 6px\">\n<div style=\"font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: #B8282E; font-weight: 700\">Qué vas a aprender<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\"><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Compras y comercialización<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Finanzas<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Recursos humanos<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Contabilidad<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Gestión de la información<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 14px; padding: 32px; background: #F7F2EF; border-radius: 20px\">\n<div style=\"font-family: Georgia, serif; font-size: 22px; font-weight: 700; color: #282829\">Al egresar vas a poder<\u002Fdiv>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px\"><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Realizar tareas de compras, comercialización, finanzas, recursos humanos y contabilidad.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Relevar, sistematizar y relacionar la información de las distintas áreas de una organización.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Elaborar informes que ayuden a los directivos a tomar decisiones.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Asistir a los profesionales del área en su trabajo.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Trabajar en relación de dependencia o de forma autónoma.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<div id=\"computacion\" style=\"display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 56px; align-items: start; padding: 56px 0; border-top: 1px solid #E8E2DF;\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; gap: 12px; align-items: center\"><div style=\"width: 44px; height: 6px; background: #282829; border-radius: 3px\"><\u002Fdiv><div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #6A6360; font-weight: 700\">Título técnico · Desde 2021<\u002Fdiv><\u002Fdiv>\n<h3 style=\"margin: 0; font-family: Georgia, serif; font-size: 34px; line-height: 1.2; color: #282829\">Técnico en Computación<\u002Fh3>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #46423F\">Esta orientación se basa en el uso de computadoras y en la programación de sistemas y algoritmos. Vas a aprender distintos lenguajes, como Java, C++, Python y JavaScript, además de bases de datos y HTML. También trabajamos robótica con placas Arduino y participamos en distintas competencias. Las clases se dan en tres laboratorios equipados con computadoras.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 6px\">\n<div style=\"font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: #B8282E; font-weight: 700\">Qué vas a aprender<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\"><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Laboratorio de Algoritmos y Estructuras de Datos<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Bases de datos<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Proyecto informático<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Organización de las computadoras<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Lógica computacional<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Robótica con Arduino<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 14px; padding: 32px; background: #F7F2EF; border-radius: 20px\">\n<div style=\"font-family: Georgia, serif; font-size: 22px; font-weight: 700; color: #282829\">Al egresar vas a poder<\u002Fdiv>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px\"><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Proyectar, desarrollar, adaptar y mantener aplicaciones informáticas.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Instalar, configurar y mantener sistemas informáticos.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Documentar aplicaciones y sistemas, tanto para técnicos como para usuarios.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Asesorar a los usuarios en la elección, instalación y personalización de equipos y aplicaciones.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Trabajar en relación de dependencia o en emprendimientos propios o asociativos.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<div id=\"electromecanica\" style=\"display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 56px; align-items: start; padding: 56px 0; border-top: 1px solid #E8E2DF;\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; gap: 12px; align-items: center\"><div style=\"width: 44px; height: 6px; background: #DA7B53; border-radius: 3px\"><\u002Fdiv><div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #6A6360; font-weight: 700\">Título técnico · Desde 1979<\u002Fdiv><\u002Fdiv>\n<h3 style=\"margin: 0; font-family: Georgia, serif; font-size: 34px; line-height: 1.2; color: #282829\">Técnico Electromecánico<\u002Fh3>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #46423F\">Te capacita en el manejo de sistemas y equipos que combinan componentes eléctricos y mecánicos: instalación, mantenimiento y reparación de maquinaria industrial y de sistemas automatizados. Vas a desarrollar habilidades en electricidad, electrónica, mecánica y control de sistemas, para trabajar en industrias como la manufactura, la construcción y la energía.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 6px\">\n<div style=\"font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: #B8282E; font-weight: 700\">Qué vas a aprender<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\"><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Electricidad<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Electrónica<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Mecánica<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Control y automatización<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Neumática e hidráulica<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Mantenimiento industrial<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 14px; padding: 32px; background: #F7F2EF; border-radius: 20px\">\n<div style=\"font-family: Georgia, serif; font-size: 22px; font-weight: 700; color: #282829\">Al egresar vas a poder<\u002Fdiv>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px\"><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Proyectar y calcular componentes, equipos e instalaciones mecánicas, eléctricas, térmicas, hidráulicas y neumáticas.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Dirigir y ejecutar montajes e instalaciones de equipos.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Operar equipos e instalaciones y hacer su mantenimiento preventivo, correctivo y predictivo.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Realizar ensayos de materiales, equipos e instalaciones y elaborar los informes.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Gestionar compras, stock y comercialización de equipos, y llevar adelante emprendimientos propios.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<div id=\"bachillerato\" style=\"display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 56px; align-items: start; padding: 56px 0; border-top: 1px solid #E8E2DF;\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; gap: 12px; align-items: center\"><div style=\"width: 44px; height: 6px; background: #A8262C; border-radius: 3px\"><\u002Fdiv><div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #6A6360; font-weight: 700\">Bachillerato · Desde 2015<\u002Fdiv><\u002Fdiv>\n<h3 style=\"margin: 0; font-family: Georgia, serif; font-size: 34px; line-height: 1.2; color: #282829\">Bachiller en Ciencias Sociales<\u002Fh3>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #46423F\">La orientación en Ciencias Sociales y Humanidades te propone hacerte preguntas sobre el mundo social y buscar explicaciones. Vas a analizar temas de actualidad que generan debate público, valorando el diálogo y la pluralidad de voces, y a desarrollar un pensamiento crítico que te permita asumir un rol activo en tu comunidad.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 12px; padding-top: 6px\">\n<div style=\"font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: #B8282E; font-weight: 700\">Qué vas a aprender<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\"><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Pensamiento crítico<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Actualidad y debate público<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Diversidad cultural<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Ambiente y desarrollo sustentable<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Patrimonio y cultura<\u002Fdiv><div style=\"font-size: 15px; color: #282829; background: #F3EEEB; padding: 8px 14px; border-radius: 999px\">Análisis de datos y fuentes<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 14px; padding: 32px; background: #F7F2EF; border-radius: 20px\">\n<div style=\"font-family: Georgia, serif; font-size: 22px; font-weight: 700; color: #282829\">Al egresar vas a poder<\u002Fdiv>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px\"><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Analizar críticamente información y fuentes de las ciencias sociales y las humanidades.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Argumentar en temas controvertidos y comunicar tus ideas de forma oral y escrita.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Reconocer la diversidad cultural, étnica, lingüística, religiosa y de género.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Comprometerte con acciones para cuidar el ambiente y promover un desarrollo sustentable.<\u002Fli><li style=\"font-size: 17px; line-height: 1.55; color: #46423F\">Valorar y cuidar el patrimonio cultural local, nacional y mundial.<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SOBRE NOSOTROS: HISTORIA -->\n<section id=\"nosotros\" style=\"padding: 96px 64px; background: #F7F2EF; display: flex; flex-direction: column; gap: 56px\">\n<div id=\"historia\" style=\"display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 64px; align-items: center\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<div style=\"font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #B8282E; font-weight: 700\">Sobre nosotros · Nuestra historia<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: Georgia, serif; font-size: 44px; line-height: 1.15; color: #282829\">De una casilla con piso de tierra a una escuela técnica<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #46423F\">Villa Soldati era un barrio de terrenos bajos e inundables, levantado a fuerza de trabajo compartido. Allí llegó en 1957 el padre Leoncio Herrero, destinado a la recién fundada parroquia Nuestra Señora de Fátima. Al año siguiente abrió la primera aula para los chicos del barrio que no tenían escuela.<\u002Fp>\n<\u002Fdiv>\n<figure style=\"margin: 0; display: flex; flex-direction: column; gap: 12px\">\n<img src=\"f8449fdf-2fe1-4f77-8864-da7ccb73a63e\" alt=\"Foto de archivo: el padre Leoncio caminando de la mano con niños del barrio frente a una casilla de madera\" style=\"width: 100%; max-width: 420px; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 20px; display: block; filter: sepia(0.25); box-shadow: 0 10px 28px rgba(40,40,41,0.18)\">\n<figcaption style=\"font-size: 15px; line-height: 1.5; color: #6A6360; font-style: italic\">Los comienzos: el padre Leoncio con los chicos del barrio.<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 32px 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 4px solid #DB353A\">\n<div style=\"font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: #B8282E\">1958<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.55; color: #46423F\">El padre Leoncio inaugura la primera aula de infantes, en una casilla con piso de tierra.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 4px solid #DB353A\">\n<div style=\"font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: #B8282E\">1959<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.55; color: #46423F\">Se construye sobre la laguna conocida como \"El Palafito\" y el espacio educativo crece.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 4px solid #DB353A\">\n<div style=\"font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: #B8282E\">1970<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.55; color: #46423F\">Comienza a funcionar la escuela primaria para jóvenes y adultos.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 4px solid #DB353A\">\n<div style=\"font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: #B8282E\">1979<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.55; color: #46423F\">Se inaugura el nivel secundario técnico, con la especialidad Electromecánica.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 4px solid #DB353A\">\n<div style=\"font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: #B8282E\">1989<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.55; color: #46423F\">Se formaliza el instituto técnico, orientado al sistema dual de educación y trabajo.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 4px solid #DB353A\">\n<div style=\"font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: #B8282E\">2013<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.55; color: #46423F\">Fátima se incorpora a la Red Educativa Marianista.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 4px solid #DB353A\">\n<div style=\"font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: #B8282E\">2015<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.55; color: #46423F\">Se lanza la orientación Bachiller en Ciencias Sociales.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 4px solid #DB353A\">\n<div style=\"font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: #B8282E\">2016<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.55; color: #46423F\">Comienza la orientación Técnico en Gestión y Administración de las Organizaciones.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 4px solid #DB353A\">\n<div style=\"font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: #B8282E\">2021<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.55; color: #46423F\">Comienza la orientación Técnico en Computación.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 4px solid #282829\">\n<div style=\"font-family: Georgia, serif; font-size: 30px; font-weight: 700; color: #282829\">Hoy<\u002Fdiv>\n<div style=\"font-size: 16px; line-height: 1.55; color: #46423F\">Cuatro orientaciones en la secundaria diurna, en Pergamino 2882.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SOBRE NOSOTROS: PADRE LEONCIO -->\n<section id=\"leoncio\" style=\"padding: 96px 64px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 72px; align-items: center\">\n<figure style=\"margin: 0; display: flex; flex-direction: column; gap: 14px\">\n<img src=\"9d65fb62-efc5-40c2-b2cc-c8c6a3d70726\" alt=\"El padre Leoncio Herrero sonriendo, rodeado de chicos de la escuela\" style=\"width: 100%; aspect-ratio: 880 / 495; object-fit: cover; border-radius: 28px; display: block\">\n<figcaption style=\"font-size: 15px; line-height: 1.5; color: #6A6360; font-style: italic\">El padre Leoncio Herrero junto a los chicos de Fátima.<\u002Ffigcaption>\n<\u002Ffigure>\n<div style=\"display: flex; flex-direction: column; gap: 22px\">\n<div style=\"font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #B8282E; font-weight: 700\">Nuestra historia · Nuestro fundador<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: Georgia, serif; font-size: 44px; line-height: 1.15; color: #282829\">Padre Leoncio Herrero Núñez<\u002Fh2>\n<div style=\"font-size: 16px; color: #6A6360\">Villalpando, Zamora, 1929 · Buenos Aires, 2015<\u002Fdiv>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #46423F\">Encontró un barrio golpeado por la pobreza y respondió con una escuela. Dedicó su vida a transformar la realidad de miles de chicos y jóvenes de Villa Soldati a través de la educación.<\u002Fp>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #46423F\">Una ex alumna recuerda que, cuando el barrio se inundaba, las familias construían puentes de madera para que todos pudieran llegar a clase. Junto a él trabajó durante sesenta años el padre Paco Blanco Martín.<\u002Fp>\n<div style=\"display: flex; gap: 12px; flex-wrap: wrap; padding-top: 6px\">\n<div style=\"padding: 12px 22px; border-radius: 999px; background: #DB353A; color: #FFFFFF; font-size: 17px; font-weight: 700\">Pacíficos<\u002Fdiv>\n<div style=\"padding: 12px 22px; border-radius: 999px; background: #DB353A; color: #FFFFFF; font-size: 17px; font-weight: 700\">Solidarios<\u002Fdiv>\n<div style=\"padding: 12px 22px; border-radius: 999px; background: #DB353A; color: #FFFFFF; font-size: 17px; font-weight: 700\">Agradecidos<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SOBRE NOSOTROS: MARIANISTAS -->\n<section id=\"marianistas\" style=\"padding: 0 64px 96px 64px\">\n<div style=\"display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 56px; align-items: center; padding: 56px; background: #282829; border-radius: 28px; color: #FFFFFF\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<div style=\"font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #F0A283; font-weight: 700\">Sobre nosotros · Red Marianista<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: Georgia, serif; font-size: 40px; line-height: 1.15; color: #FFFFFF\">Una obra marianista<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #E8E2DF\">Desde 2013 Fátima forma parte de la Red Educativa Marianista, inspirada en el beato Guillermo José Chaminade. Su propuesta busca formar personas capaces de construir una sociedad plural, solidaria, democrática y cuidadosa del entorno.<\u002Fp>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #E8E2DF\">Ese ideal se une al espíritu que dejó el padre Leoncio: una escuela con vocación social, atenta al barrio y comprometida con cada chico que llega.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: center\">\n<img src=\"c68bec63-7417-4d27-a682-81d940de7221\" alt=\"\" style=\"width: 220px; height: 220px; display: block\">\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONTACTO -->\n<section id=\"contacto\" style=\"padding: 88px 64px; background: #DB353A; color: #FFFFFF; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px; align-items: start\">\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<h2 style=\"margin: 0; font-family: Georgia, serif; font-size: 44px; line-height: 1.15; color: #FFFFFF\">Contacto<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.65; color: #FFFFFF\">¿Tenés consultas sobre inscripciones o la vida escolar? Escribinos a secretaría o acercate en el horario de atención.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 22px; font-size: 18px; line-height: 1.5\">\n<div><div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #FFFFFF; opacity: 1\">Dirección<\u002Fdiv><div>Pergamino 2882, Villa Soldati, CABA<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #FFFFFF; opacity: 1\">Correo de secretaría<\u002Fdiv><a href=\"mailto:secretaria.sd@fatimarem.edu.ar\" style=\"color: #FFFFFF\">secretaria.sd@fatimarem.edu.ar<\u002Fa><\u002Fdiv>\n<div><div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #FFFFFF; opacity: 1\">Horario de atención<\u002Fdiv><div>Lunes a viernes, de 8 a 14 h<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #FFFFFF; opacity: 1\">Instagram<\u002Fdiv><a href=\"https://www.instagram.com/institutofatimasoldati/\" style=\"color: #FFFFFF\">@institutofatimasoldati<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"padding: 40px 64px; background: #1C1C1D; color: #E8E2DF; font-size: 15px; display: grid; grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr)); gap: 40px; align-items: start\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<img src=\"c68bec63-7417-4d27-a682-81d940de7221\" alt=\"\" style=\"width: 56px; height: 56px; display: block\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><div style=\"font-weight: 700; color: #FFFFFF\">Instituto Técnico Nuestra Señora de Fátima<\u002Fdiv><div>Secundaria Diurna · A-893 · Red Educativa Marianista<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px; line-height: 1.5\">\n<div>Pergamino 2882, Villa Soldati, CABA<\u002Fdiv>\n<div>Lunes a viernes, 8 a 14 h<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px; line-height: 1.5\">\n<a href=\"mailto:secretaria.sd@fatimarem.edu.ar\" style=\"color: #F0A283\">secretaria.sd@fatimarem.edu.ar<\u002Fa>\n<a href=\"https://www.instagram.com/institutofatimasoldati/\" style=\"color: #F0A283\">@institutofatimasoldati<\u002Fa>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#DB353A&quot;,&quot;options&quot;:[&quot;#DB353A&quot;,&quot;#A8262C&quot;,&quot;#282829&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:7200}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { accent: this.props.accent ?? '#DB353A' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
